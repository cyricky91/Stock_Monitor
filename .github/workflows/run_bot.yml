name: Stock Monitor Bot

on:
  schedule:
    # 每 30 分鐘執行一次 (注意：GitHub Actions 的 cron 有時會有延遲)
    - cron: '*/30 1-20 * * 1-5'
  workflow_dispatch: # 支援手動觸發執行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v3

      - name: 設定 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行診斷程序
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}  # <--- 這裡一定要有，程式才讀得到
        run: python cron_job.py
